[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metalmind"
version = "0.1.0"
description = "Verified Metal kernel optimization for PyTorch on Apple Silicon"
requires-python = ">=3.11"
dependencies = ["torch==2.15.0", "numpy>=2"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "build>=1"]

[project.scripts]
metalmind = "metalmind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gpu: requires real Apple Silicon MPS execution"]
